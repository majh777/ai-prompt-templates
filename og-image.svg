<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#2563eb" opacity="0.1"/>
  <circle cx="1100" cy="530" r="250" fill="#10b981" opacity="0.1"/>

  <!-- Lightning bolt using polygon -->
  <polygon points="620,80 680,160 640,160 660,260 580,170 620,170" fill="#fbbf24"/>

  <!-- Main heading -->
  <text x="600" y="310" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" fill="white" text-anchor="middle">AI Prompt Templates</text>

  <!-- Subheading -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="32" fill="#9ca3af" text-anchor="middle">50+ Battle-Tested Prompts That Convert</text>

  <!-- Divider line -->
  <rect x="400" y="410" width="400" height="4" rx="2" fill="url(#accent)"/>

  <!-- Value props - using simple text marks instead of emoji -->
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="28" fill="#10b981" text-anchor="middle">Copy | Paste | Profit</text>

  <!-- Price badge -->
  <rect x="460" y="500" width="280" height="70" rx="35" fill="#2563eb"/>
  <text x="600" y="547" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">$47 one-time</text>

  <!-- Bottom tagline -->
  <text x="600" y="610" font-family="Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle">Email | Social Media | Content | Sales Copy</text>
</svg>